name: ci

# Minimal quality gate for the Codex plugin on the main branch.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: plugin syntax + smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax-check plugin scripts
        run: |
          for f in plugins/xcodex-usage/scripts/*.js; do
            echo "checking $f"
            node --check "$f"
          done

      - name: Plugin smoke (must not crash without a Codex transcript)
        run: |
          echo '{}' | node plugins/xcodex-usage/scripts/record.js
          echo
          node plugins/xcodex-usage/scripts/usage.js
          echo
          echo "plugin smoke ok"
